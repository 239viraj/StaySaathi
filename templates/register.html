<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - PG Finder</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <div class="logo">
        <a href="{{ url_for('home') }}">
            Residence Finder
        </a>
    </div>

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('find_pg') }}">
            Find Residence
        </a>

        <a href="{{ url_for('about') }}">
            About
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </nav>

</header>


<main>

    <div class="auth-container">

        <div class="auth-box">

            <h1>StaySaathi</h1>

            <h2>Create Account</h2>

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{csrf_token()}}">

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >

                <!-- Password -->
                <div class="password-container">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        aria-label="Show password">
                        👁️
                    </button>

                </div>

                <select name="role" required>

                    <option value="">
                        Select Account Type
                    </option>

                    <option value="student">
                        Student / Customer
                    </option>

                    <option value="owner">
                        PG Owner
                    </option>
                    <option value="food_owner">
                        Food Business Owner
                    </option>

                </select>

                <button type="submit">
                    Create Account
                </button>

            </form>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <p class="message">
                            {{ message }}
                        </p>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <p>

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>

    </div>

</main>
<script>
function togglePassword() {
    const password = document.getElementById("password");

    if (password.type === "password") {
        password.type = "text";
    } else {
        password.type = "password";
    }
}
</script>

</body>

</html>
