<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Report PG - PG Finder</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="navbar-brand">
            PG Finder
        </div>

        <div class="navbar-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('find_pg') }}">
                Find PG
            </a>

            <a href="{{ url_for('student_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('logout') }}">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         REPORT CONTAINER
    ========================== -->

    <div class="report-page">

        <div class="report-card">

            <div class="report-header">

                <h1>
                    🚨 Report PG
                </h1>

                <p>
                    Help us keep PG Finder safe and reliable.
                </p>

            </div>


            <!-- =========================
                 PG INFORMATION
            ========================== -->

            <div class="report-pg-info">

                <h2>
                    {{ pg.name }}
                </h2>

                <p>
                    📍 {{ pg.address }}
                </p>

            </div>


            <!-- =========================
                 REPORT FORM
            ========================== -->

            <form
                method="POST"
                action="{{ url_for('report_pg', pg_id=pg.id) }}"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">

                    <label for="reason">
                        Why are you reporting this PG?
                    </label>

                    <select id="reason" name="reason" required>
                        <option value="">Select a reason</option>
                        <option value="Fake listing">Fake or misleading information</option>
                        <option value="Incorrect Information">Incorrect information</option>
                        <option value="Fraud or Scam">Fraud or scam</option>
                        <option value="Unsafe Property">Safety concern</option>
                        <option value="Wrong location">Wrong location</option>
                        <option value="Other">Other</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Additional details
                        <span>(Optional)</span>
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="6"
                        maxlength="239"
                        placeholder="Tell us more about the problem..."
                    ></textarea>

                </div>


                <!-- =========================
                     ACTIONS
                ========================== -->

                <div class="report-actions">

                    <a
                        href="{{ url_for(
                            'pg_details',
                            pg_id=pg.id
                        ) }}"
                        class="report-cancel-button"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="report-submit-button"
                    >
                        🚨 Submit Report
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
